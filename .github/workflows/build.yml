name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build web UI + bundle MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/xberg-wasm

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      # apps/web imports @xberg-io/xberg-wasm as a workspace package (crates/xberg-wasm),
      # so its wasm-pack output (pkg/web/*.js + *.d.ts) must exist before the web build
      # can resolve or typecheck it. Default features only — no libheif/wasi-sdk needed.
      - name: Build @xberg-io/xberg-wasm (wasm-pack)
        run: pnpm --filter @xberg-io/xberg-wasm build

      - name: Build web UI (static export)
        run: pnpm --filter web build

      - name: Build node-pipeline (provides dist consumed by mcp-server)
        run: pnpm --filter node-pipeline build

      - name: Build MCP server (tsup ESM)
        run: pnpm --filter mcp-server build

      - name: Build node-pipeline (dependency of MCP server)
        run: pnpm --filter @xberg-io/node-pipeline build

      - name: Bundle web UI into MCP server public dir
        run: cp -r apps/web/out services/mcp-server/public

      - name: Vendor @xberg-io/xberg-wasm into public/wasm
        run: |
          if [ -d "node_modules/@xberg-io/xberg-wasm" ]; then
            mkdir -p services/mcp-server/public/wasm
            cp -r node_modules/@xberg-io/xberg-wasm services/mcp-server/public/wasm
          else
            echo "::warning::@xberg-io/xberg-wasm not installed; skipping wasm vendoring"
          fi

      - name: Upload MCP server bundle
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-bundle
          path: services/mcp-server
          if-no-files-found: error

  wrap:
    name: Wrap standalone binaries
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Download MCP server bundle
        uses: actions/download-artifact@v4
        with:
          name: mcp-server-bundle
          path: services/mcp-server

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Build node-pipeline (dependency of MCP server)
        run: pnpm --filter @xberg-io/node-pipeline build

      - name: Smoke check (serve --version)
        shell: bash
        run: node services/mcp-server/dist/index.js serve --version

      # Signing (Task 3) runs in sign.yml / release.yml after this step.
      # @yao-pkg/pkg embeds Node 22 into a standalone binary from dist/index.js.
      - name: Wrap windows
        if: matrix.os == 'windows-latest'
        run: pnpm dlx @yao-pkg/pkg@6.21.0 services/mcp-server/dist/index.js --targets node22-win-x64 --output xberg-mcp-windows.exe

      - name: Wrap linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm dlx @yao-pkg/pkg@6.21.0 services/mcp-server/dist/index.js --targets node22-linux-x64 --output xberg-mcp-linux

      - name: Wrap darwin
        if: matrix.os == 'macos-latest'
        run: pnpm dlx @yao-pkg/pkg@6.21.0 services/mcp-server/dist/index.js --targets node22-macos-x64 --output xberg-mcp-darwin

      - name: Upload windows binary
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: xberg-mcp-windows.exe
          path: xberg-mcp-windows.exe

      - name: Upload linux binary
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: xberg-mcp-linux
          path: xberg-mcp-linux

      - name: Upload darwin binary
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: xberg-mcp-darwin
          path: xberg-mcp-darwin
